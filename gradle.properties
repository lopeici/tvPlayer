# NOTE: On the maintainer's Windows box the username contains a non-ASCII char (é)
# which breaks the JVM NIO selector's AF_UNIX self-pipe unless java.io.tmpdir points
# at an ASCII path. That override is applied there via build.ps1 (JAVA_TOOL_OPTIONS),
# not here, so this file stays portable across macOS/Linux/Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
