# java.io.tmpdir is forced to an ASCII path: the Windows username contains a
# non-ASCII char (é) which breaks the JVM NIO selector's AF_UNIX self-pipe.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:\\tmp
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
